<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String & Vowel Operations</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Case Study Operations</h1>
            <p>Reverse strings and count vowels instantly</p>
        </header>
        
        <main>
            <section class="card" id="reverse-section">
                <h2>1. Reverse a String</h2>
                <div class="input-group">
                    <input type="text" id="string-input" placeholder="Enter string to reverse...">
                    <button id="reverse-btn">Reverse</button>
                </div>
                <div class="result-box" id="reverse-result">
                    <span class="placeholder">Result will appear here</span>
                </div>
            </section>

            <section class="card" id="vowel-section">
                <h2>2. Count Vowels in Paragraph</h2>
                <div class="input-group">
                    <textarea id="paragraph-input" rows="4" placeholder="Enter paragraph here..."></textarea>
                    <button id="vowel-btn">Count Vowels</button>
                </div>
                <div class="result-box" id="vowel-result">
                    <span class="placeholder">Result will appear here</span>
                </div>
            </section>
        </main>
    </div>
    <script src="SCRIPT.JS"></script>
</body>
</html>

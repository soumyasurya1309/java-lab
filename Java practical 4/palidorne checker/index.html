<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker | Glassmorphism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="glass-card">
        <div class="card-header">
            <h1>Palindrome Checker</h1>
            <p id="heading"></p>
        </div>

        <div class="input-group">
            <input type="text" id="word" placeholder="Enter a word (e.g., racecar)" autocomplete="off" aria-label="Word to check">
            <button onclick="checkPalindrome()" class="glass-btn">
                <span>Check</span>
                <div class="btn-shine"></div>
            </button>
        </div>

        <div id="result" class="result-area" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

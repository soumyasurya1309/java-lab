<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon">👥</span> Employee Manager</h1>
            <p>Manage employee records using JavaScript &amp; JSON</p>
        </header>

        <div class="grid">
            <div class="card form-card">
                <h2>Add Employee</h2>
                <form id="empForm">
                    <div class="input-group">
                        <label for="empId">Employee ID</label>
                        <input type="text" id="empId" placeholder="e.g. 101" required>
                    </div>
                    <div class="input-group">
                        <label for="empName">Employee Name</label>
                        <input type="text" id="empName" placeholder="e.g. Alice Johnson" required>
                    </div>
                    <div class="input-group">
                        <label for="dept">Department</label>
                        <input type="text" id="dept" placeholder="e.g. Engineering" required>
                    </div>
                    <div class="input-group">
                        <label for="salary">Salary</label>
                        <input type="number" id="salary" placeholder="e.g. 75000" required>
                    </div>
                    <button type="submit" class="btn btn-green">➕ Add Employee</button>
                </form>
            </div>

            <div class="card table-card">
                <div class="table-header">
                    <h2>Employee Records</h2>
                    <button id="loadBtn" class="btn btn-blue">⬇ Load Employees</button>
                </div>
                <table id="empTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Salary</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="emptyMsg" class="empty-msg">No records yet — add one or load from JSON.</p>
                <div class="json-output">
                    <div class="json-header">
                        <h3>Live JSON Output</h3>
                        <button id="saveBtn" class="btn btn-purple">💾 Save as JSON</button>
                    </div>
                    <pre id="jsonDisplay"></pre>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
